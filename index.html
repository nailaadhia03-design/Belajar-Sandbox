<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox: Warehouse Software Demo</title>

<style>
  :root { --ink:#1d2428; --muted:#5b676e; --accent:#0f5c63; --line:#d5dcdf; --bg:#f7f9f9; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8eef0; --muted:#a3b0b5; --accent:#6cc4cc; --line:#34414a; --bg:#161d21; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .75rem; }
  p { margin: 0 0 1.25rem; color: var(--muted); }
  form { display:grid; gap:.9rem; padding:1.25rem; border:1px solid var(--line); border-radius:8px; }
  label { display:grid; gap:.3rem; font-size:.9rem; }
  input { font:inherit; padding:.6rem .7rem; border:1px solid var(--line); border-radius:6px;
          background:transparent; color:var(--ink); }
  button, .chat { font:inherit; font-weight:600; padding:.7rem 1rem; border-radius:6px;
                  border:2px solid var(--accent); cursor:pointer; text-align:center; text-decoration:none; }
  button { background:var(--accent); color:#fff; }
  .chat { display:inline-block; margin-top:1rem; color:var(--accent); background:transparent; }
  button:focus-visible, .chat:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #thanks { display:none; margin-top:1rem; color:var(--ink); }
  small { display:block; margin-top:2.5rem; color:var(--muted); }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) (bagian 2 dari 2).
     Ganti GTM-XXXXXXX juga di sini. -->
GTM-5NDD6377
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5NDD6377"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<main>
  <h1>Keep every warehouse count accurate</h1>
  <p>Stockwise tracks inventory across your sites in real time, so your team stops chasing mismatched spreadsheets.</p>

  <form id="demo-form">
    <label>Name <input name="name" autocomplete="name" required></label>
    <label>Work email <input name="email" type="email" autocomplete="email" required></label>
    <label>Company <input name="company" autocomplete="organization"></label>
    <button id="btn-demo" type="submit">Request a demo</button>
  </form>
  <p id="thanks" role="status">Thanks, we have your request.</p>

  <a id="btn-chat" class="chat" href="#chat">Chat with sales</a>

  <small>Sandbox page for tracking practice. Not a real product.</small>
</main>

<script>
  // Untuk latihan minggu depan: saat formulir dikirim, halaman ini mengirim
  // event bernama "demo_request" ke dataLayer. Abaikan dulu hari ini.
  document.getElementById('demo-form').addEventListener('submit', function (e) {
    e.preventDefault();
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'demo_request', form_id: 'demo-form' });
    document.getElementById('thanks').style.display = 'block';
    this.reset();
  });
</script>
</body>
</html>
